<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI framework: agents, rules, skills, run chain and gates</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h1 { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .h3 { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .t  { font-size: 12.5px; fill: #334155; }
      .s  { font-size: 11.5px; fill: #475569; }
      .m  { font-size: 11.5px; fill: #0f172a; font-family: Consolas, "Cascadia Mono", monospace; }
      .box { stroke-width: 1.5; rx: 10; }
      .int { fill: #faf5ff; stroke: #9333ea; }
      .emb { fill: #fff7ed; stroke: #ea580c; }
      .bck { fill: #eff6ff; stroke: #2563eb; }
      .frt { fill: #f0fdf4; stroke: #16a34a; }
      .rev { fill: #fefce8; stroke: #ca8a04; }
      .neu { fill: #f8fafc; stroke: #64748b; }
      .gate { fill: #ecfeff; stroke: #0891b2; }
      .flow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .ref { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <text x="30" y="44" class="h1">AI framework: how work flows from a request to a verified commit</text>
  <text x="30" y="68" class="t">Tool-neutral Markdown in <tspan class="m">ai/</tspan>. Agents are generic roles; rules hold every project fact; skills are procedures; scripts keep all three honest.</text>

  <!-- knowledge column -->
  <rect x="20" y="92" width="270" height="560" class="box neu"/>
  <text x="36" y="118" class="h2">Knowledge (one place each)</text>

  <text x="36" y="148" class="h3">ai/agents/ · WHO</text>
  <text x="36" y="166" class="s">role, workflow, hand-off note.</text>
  <text x="36" y="182" class="s">No project facts.</text>

  <text x="36" y="212" class="h3">ai/rules/ · WHAT</text>
  <text x="36" y="230" class="s">contracts, ports, rates, decisions,</text>
  <text x="36" y="246" class="s">checks per layer. common.md + one</text>
  <text x="36" y="262" class="s">file per agent.</text>

  <text x="36" y="292" class="h3">ai/skills/ · HOW</text>
  <text x="36" y="310" class="m">run-chain  build-and-test</text>
  <text x="36" y="326" class="m">add-a429-parameter</text>
  <text x="36" y="342" class="m">run-and-verify-demo</text>
  <text x="36" y="358" class="m">debug-pipeline</text>
  <text x="36" y="374" class="m">commit-and-review</text>

  <text x="36" y="404" class="h3">ai/ownership.json · WHERE</text>
  <text x="36" y="422" class="s">which agent may edit which path;</text>
  <text x="36" y="438" class="s">longest match wins.</text>

  <text x="36" y="468" class="h3">ai/chain.json · WHEN</text>
  <text x="36" y="486" class="s">stages M0–M9: owner, deliverables,</text>
  <text x="36" y="502" class="s">automated checks.</text>

  <text x="36" y="532" class="h3">Entry points</text>
  <text x="36" y="550" class="m">AGENTS.md</text>
  <text x="120" y="550" class="s">any AI tool</text>
  <text x="36" y="568" class="m">CLAUDE.md, .claude/</text>
  <text x="36" y="584" class="s">Claude Code; .claude/ is generated</text>
  <text x="36" y="600" class="s">by tools/check-ai.mjs --write</text>
  <text x="36" y="632" class="s">Edit a fact once, in ai/rules/.</text>

  <!-- request -->
  <rect x="330" y="92" width="200" height="56" class="box neu"/>
  <text x="346" y="116" class="h3">You</text>
  <text x="346" y="135" class="s">a task, a decision, an approval</text>

  <!-- integrator -->
  <rect x="580" y="92" width="600" height="100" class="box int"/>
  <text x="596" y="118" class="h2">Integrator (coordinator)</text>
  <text x="596" y="140" class="t">Owns shared/ contracts, tools/, e2e tests, docs, the framework and CI.</text>
  <text x="596" y="158" class="t">Classifies the task, writes the spec, edits shared/, briefs one agent per layer,</text>
  <text x="596" y="176" class="t">lands all layers together or none. Recorded decisions go back to you.</text>
  <path d="M530,120 L578,120" class="flow"/>

  <!-- run chain strip -->
  <text x="330" y="218" class="h3">Run chain</text>
  <text x="410" y="218" class="m">node tools/chain.mjs</text>
  <text x="566" y="218" class="s">runs each stage's checks, stops at the first failure and prints the brief for its owner</text>
  <g transform="translate(330,238)">
    <rect x="0" y="0" width="80" height="50" rx="8" class="int" stroke-width="1.5"/>
    <text x="9" y="20" class="h3">M0</text><text x="9" y="38" class="s">toolchain</text>
    <rect x="85" y="0" width="80" height="50" rx="8" class="bck" stroke-width="1.5"/>
    <text x="94" y="20" class="h3">M1</text><text x="94" y="38" class="s">A429 codec</text>
    <rect x="170" y="0" width="80" height="50" rx="8" class="emb" stroke-width="1.5"/>
    <text x="179" y="20" class="h3">M2</text><text x="179" y="38" class="s">firmware</text>
    <rect x="255" y="0" width="80" height="50" rx="8" class="emb" stroke-width="1.5"/>
    <text x="264" y="20" class="h3">M3</text><text x="264" y="38" class="s">real pad (hw)</text>
    <rect x="340" y="0" width="80" height="50" rx="8" class="bck" stroke-width="1.5"/>
    <text x="349" y="20" class="h3">M4</text><text x="349" y="38" class="s">backend</text>
    <rect x="425" y="0" width="80" height="50" rx="8" class="frt" stroke-width="1.5"/>
    <text x="434" y="20" class="h3">M5</text><text x="434" y="38" class="s">SFD + config</text>
    <rect x="510" y="0" width="80" height="50" rx="8" class="int" stroke-width="1.5"/>
    <text x="519" y="20" class="h3">M6</text><text x="519" y="38" class="s">e2e + replay</text>
    <rect x="595" y="0" width="80" height="50" rx="8" class="emb" stroke-width="1.5"/>
    <text x="604" y="20" class="h3">M7</text><text x="604" y="38" class="s">50 Hz</text>
    <rect x="680" y="0" width="80" height="50" rx="8" class="int" stroke-width="1.5"/>
    <text x="689" y="20" class="h3">M8</text><text x="689" y="38" class="s">framework</text>
    <rect x="765" y="0" width="80" height="50" rx="8" class="emb" stroke-width="1.5"/>
    <text x="774" y="20" class="h3">M9</text><text x="774" y="38" class="s">keyboard</text>
  </g>
  <text x="330" y="306" class="s">Status per stage: DONE · MANUAL (a person confirms by eye) · FAIL · SKIP (waits, or no toolchain / no pad). Colour = owning agent.</text>

  <!-- layer agents -->
  <path d="M1130,192 L1130,236" class="flow"/>
  <path d="M540,314 C 540,342 465,340 465,368" class="flow"/>
  <path d="M710,314 C 710,342 755,340 755,368" class="flow"/>
  <path d="M795,314 C 795,342 1045,340 1045,368" class="flow"/>
  <text x="580" y="336" class="s">brief per stage:</text>
  <text x="580" y="352" class="s">goal · paths · rules · checks</text>

  <rect x="330" y="370" width="270" height="150" class="box emb"/>
  <text x="346" y="396" class="h2">Embedded agent</text>
  <text x="346" y="416" class="m">firmware/  host/</text>
  <text x="346" y="438" class="s">rules: common + embedded</text>
  <text x="346" y="456" class="s">bare metal, zero warnings, timing</text>
  <text x="346" y="472" class="s">measured, byte-exact contracts</text>
  <text x="346" y="500" class="s">done: chain M2, M3, M7, M9</text>

  <rect x="620" y="370" width="270" height="150" class="box bck"/>
  <text x="636" y="396" class="h2">Backend agent</text>
  <text x="636" y="416" class="m">backend/  2 unit-test files</text>
  <text x="636" y="438" class="s">rules: common + backend</text>
  <text x="636" y="456" class="s">decode + units + validity only;</text>
  <text x="636" y="472" class="s">never throws on wire input</text>
  <text x="636" y="500" class="s">done: chain M1, M4, M6</text>

  <rect x="910" y="370" width="270" height="150" class="box frt"/>
  <text x="926" y="396" class="h2">Frontend agent</text>
  <text x="926" y="416" class="m">frontend/</text>
  <text x="926" y="438" class="s">rules: common + frontend</text>
  <text x="926" y="456" class="s">show only decoded values; every</text>
  <text x="926" y="472" class="s">element handles STALE / NCD / INOP</text>
  <text x="926" y="500" class="s">done: chain M5 + browser check</text>

  <!-- hand-off -> reviewer -->
  <path d="M465,520 C 465,560 640,560 660,578" class="flow"/>
  <path d="M755,520 L755,576" class="flow"/>
  <path d="M1045,520 C 1045,560 870,560 850,578" class="flow"/>
  <text x="946" y="600" class="s">hand-off note from each agent:</text>
  <text x="946" y="616" class="s">changed · contract impact ·</text>
  <text x="946" y="632" class="s">verified · not verified</text>

  <rect x="580" y="580" width="350" height="72" class="box rev"/>
  <text x="596" y="606" class="h2">Reviewer agent (read-only)</text>
  <text x="596" y="626" class="s">checks the combined diff against every rule file;</text>
  <text x="596" y="642" class="s">findings marked CONFIRMED or PLAUSIBLE; never edits</text>

  <!-- gates -->
  <path d="M755,652 L755,690" class="flow"/>
  <rect x="330" y="692" width="850" height="88" class="box gate"/>
  <text x="346" y="716" class="h2">Gates (same commands locally, in the pre-commit hook and in CI)</text>
  <text x="346" y="740" class="m">node tools/check-ai.mjs</text>
  <text x="530" y="740" class="s">rules vs code: labels, ports, rates, counts, paths, wrappers</text>
  <text x="346" y="760" class="m">node tools/check-ownership.mjs</text>
  <text x="590" y="760" class="s">every changed file has an owner; --agent X fails outside X's paths</text>
  <text x="346" y="776" class="m"></text>

  <!-- commit + CI -->
  <path d="M755,780 L755,812" class="flow"/>
  <rect x="330" y="814" width="400" height="66" class="box neu"/>
  <text x="346" y="838" class="h3">Commit (commit-and-review skill)</text>
  <text x="346" y="858" class="s">feature branch · one imperative sentence · explicit paths</text>
  <text x="346" y="873" class="s">push only when you ask · merge to sandbox is your call</text>

  <path d="M730,847 L778,847" class="flow"/>
  <rect x="780" y="814" width="400" height="66" class="box gate"/>
  <text x="796" y="838" class="h3">CI · .github/workflows/ci.yml</text>
  <text x="796" y="858" class="s">framework: check-ai + ownership · test: npm test, M1 M4 M5 M6</text>
  <text x="796" y="873" class="s">firmware: apt Arm GCC + QEMU, M0 M2 M7</text>

  <!-- knowledge refs -->
  <path d="M290,262 L328,262" class="ref"/>
  <path d="M290,440 L328,440" class="ref"/>
  <text x="30" y="690" class="h3">Rule of thumb</text>
  <text x="30" y="710" class="s">One layer, no contract change:</text>
  <text x="30" y="726" class="s">straight to that layer's agent.</text>
  <text x="30" y="750" class="s">Contract or several layers:</text>
  <text x="30" y="766" class="s">integrator plans and splits it.</text>
  <text x="30" y="790" class="s">Reopening a recorded decision:</text>
  <text x="30" y="806" class="s">ask the user first.</text>
  <text x="30" y="830" class="s">Missing toolchain locally:</text>
  <text x="30" y="846" class="s">SKIP here, CI is the evidence.</text>
</svg>
